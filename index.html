<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#060607" />
    <link rel="icon" type="image/png" sizes="1254x1254" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      // One origin, one session. A browser keeps the sign-in session per
      // origin, so www and the apex domain hold separate sign-ins: an OAuth
      // consent request opened on the host the visitor is not signed in on
      // shows a stale account, or none. Canonicalise to the apex before
      // anything reads the session or the URL — this runs ahead of the module
      // bundle, and the path, query, and fragment (which is where an auth
      // return carries its tokens) all come along.
      if (location.hostname.startsWith("www.")) {
        location.replace(
          location.protocol +
            "//" +
            location.hostname.slice(4) +
            (location.port ? ":" + location.port : "") +
            location.pathname +
            location.search +
            location.hash,
        );
      }
    </script>
    <script>
      try {
        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";
        const saved = localStorage.getItem("wireal.theme");
        const preference = ["light", "dark", "system"].includes(saved)
          ? saved
          : "system";
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#060607" : "#f5f5f5");
      } catch {}
    </script>
    <meta
      name="description"
      content="Wireal turns projects, dependencies, and what your agents report about the code into one living map for teams and AI agents."
    />
    <meta
      property="og:title"
      content="Wireal — Every task knows what comes next"
    />
    <meta
      property="og:description"
      content="A private, connected workspace for planning work and giving AI agents the context to move it forward."
    />
    <title>Wireal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
