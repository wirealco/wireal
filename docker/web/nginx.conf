# The Wireal web app: static files with a single-page-application fallback.
# Plain HTTP on 8080 as a non-root user; Caddy terminates TLS in front of it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # nginx drops inherited add_header lines in any block that declares its
    # own, so each location includes the security headers itself.
    location /assets/ {
        include /etc/nginx/wireal/headers.conf;
        include /etc/nginx/wireal/assets.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/wireal/headers.conf;
        add_header Cache-Control "no-cache" always;
        # A deep link or an OAuth return reaches the app shell.
        try_files $uri $uri/ /index.html;
    }
}
